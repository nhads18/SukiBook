<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SukiBook — the sari-sari store manager. Mobile for action, web for insight." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23103524'/%3E%3Cpath d='M11 25V9h6.5a4.5 4.5 0 0 1 0 9H11' stroke='%23F6A81C' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M8 14h13M8 18h11' stroke='%23F6A81C' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#103524" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SukiBook" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spline+Sans+Mono:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Alfa+Slab+One&display=swap" rel="stylesheet" />
    <title>SukiBook — Sari-Sari Store Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Boot watchdog — if the app never mounts (blocked asset, module error,
         stale cache), show a readable recovery card instead of a white screen. */
      window.__bootError = null;
      window.addEventListener("error", function (e) {
        window.__bootError = (e && e.message) || "Failed to load a resource";
      });
      window.setTimeout(function () {
        var root = document.getElementById("root");
        if (!root || root.children.length > 0) return;
        root.innerHTML =
          '<div style="min-height:100vh;display:grid;place-items:center;background:#f1f2ea;font-family:Instrument Sans,sans-serif;padding:24px">' +
          '<div style="max-width:440px;background:#fcfcf7;border:1px solid #e0e2d2;border-radius:14px;padding:28px;box-shadow:0 20px 50px -20px rgba(11,39,27,.35)">' +
          '<p style="margin:0;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#d98a0b">SukiBook · load check</p>' +
          '<h1 style="margin:8px 0 10px;font-family:Bricolage Grotesque,sans-serif;font-size:24px;color:#1b2a21">The app did not boot</h1>' +
          '<p style="margin:0;font-size:13px;line-height:1.6;color:#4c5c51">Almost always a stale preview cache. The buttons below recover in one tap' +
          (window.__bootError ? '.</p><pre style="margin:14px 0 0;padding:12px;border-radius:10px;background:#0b271b;color:#f6a81c;font-size:11px;white-space:pre-wrap">' +
          String(window.__bootError).replace(/</g, "&lt;") + "</pre>" : ".</p>") +
          '<div style="display:flex;gap:10px;margin-top:18px">' +
          '<button onclick="window.location.reload()" style="flex:1;border:0;border-radius:10px;background:#f6a81c;color:#0b271b;font-weight:800;padding:10px 0;cursor:pointer">Reload</button>' +
          '<button onclick="try{localStorage.removeItem(\'sukibook:v3\')}catch(e){} if(\'caches\' in window){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})} window.location.reload(true)" style="flex:1;border:1px solid #e0e2d2;border-radius:10px;background:#fcfcf7;color:#1b2a21;font-weight:700;padding:10px 0;cursor:pointer">Clear cache & reload</button>' +
          "</div></div></div>";
      }, 4000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
